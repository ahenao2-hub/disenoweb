<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f2744" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background decorative circles -->
  <circle cx="270" cy="190" r="160" fill="url(#bgGrad)"/>
  <circle cx="440" cy="90" r="50" fill="#3b82f6" opacity="0.15"/>
  <circle cx="90" cy="280" r="40" fill="#f59e0b" opacity="0.15"/>

  <!-- Desk Surface -->
  <rect x="70" y="310" width="400" height="12" rx="6" fill="#1e293b" opacity="0.8"/>
  <rect x="100" y="322" width="14" height="45" rx="3" fill="#0f172a" opacity="0.7"/>
  <rect x="426" y="322" width="14" height="45" rx="3" fill="#0f172a" opacity="0.7"/>

  <!-- Center Laptop / Workstation -->
  <g transform="translate(190, 160)" filter="url(#softShadow)">
    <!-- Laptop screen border -->
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Screen display -->
    <rect x="6" y="6" width="148" height="98" rx="4" fill="url(#screenGrad)"/>
    <!-- Code / Dashboard lines on screen -->
    <rect x="16" y="16" width="60" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="16" y="30" width="40" height="6" rx="2" fill="#93c5fd"/>
    <rect x="62" y="30" width="30" height="6" rx="2" fill="#fed7aa"/>
    <rect x="16" y="42" width="80" height="5" rx="2" fill="#cbd5e1" opacity="0.8"/>
    <rect x="16" y="52" width="55" height="5" rx="2" fill="#cbd5e1" opacity="0.8"/>
    <rect x="16" y="62" width="70" height="5" rx="2" fill="#cbd5e1" opacity="0.8"/>
    <!-- Mini chart on screen -->
    <rect x="106" y="52" width="10" height="25" rx="2" fill="#34d399"/>
    <rect x="120" y="40" width="10" height="37" rx="2" fill="#fbbf24"/>
    <rect x="134" y="28" width="10" height="49" rx="2" fill="#60a5fa"/>
    <!-- Laptop base -->
    <path d="M-18,110 L178,110 L166,122 L-6,122 Z" fill="#64748b"/>
    <rect x="65" y="112" width="30" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Left: Floating Document / Rubric Card -->
  <g transform="translate(50, 110)" filter="url(#softShadow)">
    <rect x="0" y="0" width="115" height="150" rx="10" fill="url(#cardGrad)"/>
    <rect x="14" y="16" width="55" height="8" rx="3" fill="#2457a7"/>
    <circle cx="95" cy="20" r="7" fill="#10b981"/>
    <path d="M92,20 L94,22 L98,18" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Document lines -->
    <rect x="14" y="36" width="87" height="6" rx="2" fill="#94a3b8" opacity="0.6"/>
    <rect x="14" y="48" width="75" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="14" y="60" width="82" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="14" y="76" width="87" height="1" fill="#e2e8f0"/>
    <!-- Progress bar in card -->
    <rect x="14" y="88" width="87" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="14" y="88" width="65" height="8" rx="4" fill="#3b82f6"/>
    <rect x="14" y="104" width="50" height="5" rx="2" fill="#64748b"/>
    <rect x="14" y="116" width="35" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="31" y="129" font-family="Arial" font-size="9" font-weight="bold" fill="#1d4ed8" text-anchor="middle">S1 - S4</text>
  </g>

  <!-- Right: Floating Analytics / Internship Card -->
  <g transform="translate(375, 95)" filter="url(#softShadow)">
    <rect x="0" y="0" width="125" height="135" rx="10" fill="url(#cardGrad)"/>
    <!-- Header -->
    <rect x="14" y="14" width="60" height="7" rx="3" fill="#0f172a"/>
    <rect x="14" y="26" width="40" height="5" rx="2" fill="#94a3b8"/>
    <!-- Bar chart -->
    <rect x="18" y="70" width="14" height="40" rx="3" fill="#93c5fd"/>
    <rect x="38" y="55" width="14" height="55" rx="3" fill="#60a5fa"/>
    <rect x="58" y="42" width="14" height="68" rx="3" fill="#2563eb"/>
    <rect x="78" y="32" width="14" height="78" rx="3" fill="#f59e0b"/>
    <rect x="98" y="50" width="14" height="60" rx="3" fill="#10b981"/>
    <!-- Bottom line -->
    <line x1="14" y1="115" x2="114" y2="115" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Academic Graduation Cap Float -->
  <g transform="translate(240, 50)" filter="url(#softShadow)">
    <polygon points="40,10 0,26 40,42 80,26" fill="#f59e0b"/>
    <polygon points="40,42 80,26 80,30 40,46" fill="#d97706"/>
    <path d="M22,34 V48 C22,53 30,57 40,57 C50,57 58,53 58,48 V34 L40,42 Z" fill="#fbbf24"/>
    <path d="M72,29 Q77,38 75,49" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="75" cy="51" r="3" fill="#ffffff"/>
  </g>

  <!-- Floating Badges / Icons -->
  <!-- Checkmark badge -->
  <g transform="translate(145, 75)" filter="url(#softShadow)">
    <circle cx="16" cy="16" r="16" fill="#10b981"/>
    <path d="M10,16 L14,20 L22,12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- User / Student badge -->
  <g transform="translate(355, 230)" filter="url(#softShadow)">
    <circle cx="20" cy="20" r="20" fill="#2457a7"/>
    <circle cx="20" cy="15" r="6" fill="#ffffff"/>
    <path d="M10,29 C10,24 14,22 20,22 C26,22 30,24 30,29" fill="#ffffff"/>
  </g>

  <!-- Coffee Cup on Desk -->
  <g transform="translate(130, 275)">
    <rect x="0" y="10" width="18" height="24" rx="3" fill="#f8fafc"/>
    <path d="M18,15 C23,15 23,23 18,23" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
    <path d="M5,4 Q9,0 5,-4 M12,4 Q16,0 12,-4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
